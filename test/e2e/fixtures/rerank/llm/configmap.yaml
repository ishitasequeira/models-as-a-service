apiVersion: v1
kind: ConfigMap
metadata:
  name: e2e-rerank-mock-script
  namespace: llm
data:
  server.py: |
    import json
    import ssl
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            return

        def _send_json(self, code, body):
            raw = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def do_GET(self):
            if self.path.rstrip("/") in ("/health", "/ready"):
                self._send_json(200, {"status": "ok"})
                return
            self.send_response(404)
            self.end_headers()

        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0) or 0)
            if length:
                self.rfile.read(length)
            if self.path.endswith("/v1/rerank"):
                self._send_json(
                    200,
                    {
                        "model": "test/e2e-rerank-model",
                        "results": [{"index": 0, "relevance_score": 0.42}],
                    },
                )
                return
            self.send_response(404)
            self.end_headers()

    if __name__ == "__main__":
        httpd = HTTPServer(("0.0.0.0", 8000), Handler)
        ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
        ctx.load_cert_chain(
            "/var/run/kserve/tls/tls.crt", "/var/run/kserve/tls/tls.key"
        )
        httpd.socket = ctx.wrap_socket(httpd.socket, server_side=True)
        httpd.serve_forever()
